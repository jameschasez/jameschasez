<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="t d">
  <title id="t">Languages across my projects</title>
  <desc id="d">PHP 54.3%, TypeScript 30.0%, HTML 5.5%, Blade 4.5%, CSS 3.9%, JavaScript 1.8% — measured from the source code of my featured systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02028A"/><stop offset="0.6" stop-color="#0b3fb8"/><stop offset="1" stop-color="#058AEB"/>
    </linearGradient>
    <clipPath id="bar"><rect x="30" y="74" width="740" height="16" rx="8"/></clipPath>
    <style>
      .h{font:700 20px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#fff}
      .s{font:500 12px 'Segoe UI',Ubuntu,sans-serif;fill:#cfe3ff}
      .l{font:600 15px 'Segoe UI',Ubuntu,sans-serif;fill:#fff}
      .p{font:500 15px 'Segoe UI',Ubuntu,sans-serif;fill:#cfe3ff}
      .seg{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.22,1,.36,1) both}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .fade{animation:fade .8s ease .6s both}@keyframes fade{from{opacity:0}to{opacity:1}}
    </style>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <circle cx="735" cy="-10" r="90" fill="#fff" opacity=".06"/><circle cx="790" cy="190" r="60" fill="#FAD430" opacity=".10"/>
  <text x="30" y="44" class="h">💻 Languages across my projects</text>
  <text x="770" y="44" class="s" text-anchor="end">measured from source · libraries excluded</text>
  <g clip-path="url(#bar)">
    <rect x="30" y="74" width="740" height="16" fill="#ffffff" opacity=".15"/>
    <g class="seg">
      <rect x="30" y="74" width="401.8" height="16" fill="#8892BF"/>
      <rect x="431.8" y="74" width="222" height="16" fill="#3178C6"/>
      <rect x="653.8" y="74" width="40.7" height="16" fill="#E34C26"/>
      <rect x="694.5" y="74" width="33.3" height="16" fill="#F7523F"/>
      <rect x="727.8" y="74" width="28.9" height="16" fill="#A97BFF"/>
      <rect x="756.7" y="74" width="13.3" height="16" fill="#F1E05A"/>
    </g>
  </g>
  <g class="fade">
    <circle cx="38" cy="125" r="6" fill="#8892BF"/><text x="52" y="130" class="l">PHP</text><text x="92" y="130" class="p">54.3%</text>
    <circle cx="288" cy="125" r="6" fill="#3178C6"/><text x="302" y="130" class="l">TypeScript</text><text x="388" y="130" class="p">30.0%</text>
    <circle cx="538" cy="125" r="6" fill="#E34C26"/><text x="552" y="130" class="l">HTML</text><text x="600" y="130" class="p">5.5%</text>
    <circle cx="38" cy="160" r="6" fill="#F7523F"/><text x="52" y="165" class="l">Blade</text><text x="102" y="165" class="p">4.5%</text>
    <circle cx="288" cy="160" r="6" fill="#A97BFF"/><text x="302" y="165" class="l">CSS</text><text x="340" y="165" class="p">3.9%</text>
    <circle cx="538" cy="160" r="6" fill="#F1E05A"/><text x="552" y="165" class="l">JavaScript</text><text x="636" y="165" class="p">1.8%</text>
  </g>
</svg>
